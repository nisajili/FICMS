# FICMS – Development stack
# Run: docker compose -f docker-compose.dev.yml up --build
# Adds Postgres, Redis, MinIO (S3-compatible), API, worker and web with live reload.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ficms
      POSTGRES_PASSWORD: ficms
      POSTGRES_DB: ficms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ficms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ficms:ficms@postgres:5432/ficms?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-please-rotate-32chars
      JWT_REFRESH_SECRET: dev-refresh-secret-please-rotate-32char
      CORS_ORIGINS: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio123
      S3_BUCKET: ficms
      S3_REGION: us-east-1
      COOKIE_SECURE: "false"
      API_PORT: 4000
      PLATFORM_BOOTSTRAP_TOKEN: dev-bootstrap-token
    command: sh -c "cd /app/apps/api && npx prisma migrate deploy && npx prisma db seed && node dist/main.js"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ficms:ficms@postgres:5432/ficms?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
