name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ficms
          POSTGRES_PASSWORD: ficms
          POSTGRES_DB: ficms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ficms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ficms/config build
          pnpm --filter @ficms/types build
          pnpm --filter @ficms/ui build

      - name: Generate + migrate + seed (postgres)
        env:
          DATABASE_URL: postgresql://ficms:ficms@localhost:5432/ficms?schema=public
        run: |
          pnpm --filter @ficms/api db:generate
          pnpm --filter @ficms/api db:deploy
          pnpm --filter @ficms/api db:seed

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: pnpm --filter @ficms/web build

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true
